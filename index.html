<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minesweeper — The Bomb</title>
    <!-- Files are kept at repo root (no /src folder) -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Minesweeper</h1>
    <div class="hud">
      <div id="mine-counter" class="mine-counter">💣 <span id="mine-count">40</span></div>
      <div id="timer" class="timer">⏱ <span id="timer-display">000</span></div>
      <div id="best-time" class="best-time">🏆 Best: <span id="best-time-display">--</span></div>
    </div>
    <div id="board" class="board"></div>

    <!-- Game-over overlay (hidden by default) -->
    <div id="game-over-overlay" class="game-over-overlay hidden" role="dialog" aria-modal="true" aria-label="Game over">
      <div class="game-over-box">
        <p id="game-over-message" class="game-over-message"></p>
        <button id="play-again-btn" class="play-again-btn">Play Again</button>
      </div>
    </div>

    <script type="module" src="game.js"></script>
  </body>
</html>
