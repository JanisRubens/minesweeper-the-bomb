<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minesweeper — The Bomb</title>
    <!-- Files are kept at repo root (no /src folder) -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="window-frame">
      <div class="title-bar">Minesweeper</div>
      <div class="window-body">
        <!-- Header panel: mine counter | smiley | timer -->
        <div class="header-panel">
          <div class="segment-display" id="mine-counter">
            <span id="mine-count">040</span>
          </div>
          <button class="smiley-btn" id="smiley-btn" aria-label="New game">🙂</button>
          <div class="segment-display" id="timer-display-box">
            <span id="timer-display">000</span>
          </div>
        </div>

        <!-- Game board with bezel -->
        <div class="board-bezel">
          <div id="board" class="board"></div>
        </div>

        <!-- Best time row -->
        <div class="best-time-row">
          <span class="best-time-label">🏆 Best:</span>
          <span id="best-time-display">--</span>
        </div>
      </div>
    </div>

    <!-- Game-over overlay (hidden by default) -->
    <div id="game-over-overlay" class="game-over-overlay hidden" role="dialog" aria-modal="true" aria-label="Game over">
      <div class="game-over-box">
        <p id="game-over-message" class="game-over-message"></p>
        <button id="play-again-btn" class="play-again-btn">Play Again</button>
      </div>
    </div>

    <script type="module" src="game.js"></script>
  </body>
</html>
